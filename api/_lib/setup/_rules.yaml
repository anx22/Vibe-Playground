# Shared rule blocks — injected into the engine setups by `rules: [...]` (see scripts/build-setup.ts).
# THIS is the one place to tune the cross-cutting word-rules. Edit, then `npm run setup`.

leitwert: |
  <leitwert_format>
  Ein Leitwert ist ein VERDICHTETER WELT-VERWEIS: ein Kompositum aus 2–4 KONKRETEN, sichtbaren Welt-/Handwerks-/Material-/Ort-Begriffen, mit Bindestrichen, das sofort eine VISUELLE Designwelt auslöst.
  MATERIALITÄT (zentral): MINDESTENS ein Teil muss ANFASSBAR sein — ein Material, eine Oberfläche, ein Objekt oder eine charakteristische Form (Glasur, Wachs, Selvedge-Kante, Raster, Fassdaube), etwas das sofort KOPFKINO und fühlbare Materialität auslöst. Rein abstrakte System-Komposita sind ein „Substantiv-Schlachtfeld" — gemeint ist eine Welt zum Anfassen, kein Diagramm.
  GUT: «Brennofen-Glasur» · «Selvedge-Webkante» · «Trafohaus-Kupfer» · «Tidenhub-Schlick».
  VERBOTEN: ganze Sätze; Verb-/Imperativ-Phrasen («… sichtbar machen»); «X ist Y»/«X trägt Y»; abstrakte Aphorismen; Wert-/Tugend-/Gefühlswörter als Leitwert («Stille», «Mut», «Würde», «Vertrauen», «Risiko», «Messung ist Mut»); rein abstrakte System-Komposita ohne anfassbaren Anker («Fehlerkorrektur-Signalfeld», bloße «-Schnittstelle»/«-Index»/«-Frequenz»).
  Der Leitwert benennt WELTEN, keine Botschaft — man muss ihn SEHEN UND ANFASSEN können.
  </leitwert_format>

diversity: |
  <diversität>
  Beispiele in diesem Prompt zeigen NUR Form und Methode, NIE den Inhalt — übernimm KEINE ihrer Welten, Berufe, Domänen oder Wörter.
  MEIDE deine Gewohnheits-Spender, die durch Übergebrauch selbst zum Klischee wurden: Tiefsee/Hydrothermalquellen, Vulkanologie/Geologie, Buchbinderei/Bleisatz, Uhrmacherei, Kartografie, Damaststahl, Nō-Theater, Quipu, Leuchtturm/Leuchtfeuer, Imkerei, Alchemie, Fermentation/Miso/Koji/Kombucha. Nutze sie NUR, wenn der Reim wirklich einzigartig ist — sonst FRISCHE, ungenutzte Domänen.
  Scanne das GESAMTE menschliche Wissen aus ALLEN Epochen — historisch BIS gegenwärtig, digital, futuristisch, spekulativ; NICHT nur historisch/vintage — und ALLEN Kulturen, Wissenschaften, Berufen, Alltag, Subkulturen, Sport, Recht, Logistik, Landwirtschaft, Medizin, Spiel, Musik. Jede der N Richtungen aus einer KOMPLETT anderen Wissensregion — keine zwei aus derselben Familie.
  Variiere Wortform UND Objekt-Metapher stark: KEINE zwei Leitwerte im Batch mit DERSELBEN Endung, und die übernutzten Endungen -Protokoll/-Membran/-Logbuch/-Almanach/-Raster/-Kodex möglichst GANZ meiden (nur wenn der Reim sie zwingend verlangt). NICHT immer Buch-/Archiv-Objekte. Das verdichtende Objekt kann ALLES sein — Werkzeug, Maschine, Kleidung, Speise, Instrument, Fahrzeug, Software, Körper, Gebäude.
  In jeder Antwort echte Überraschung statt der naheliegenden 'kreativen' Standardwelten.
  </diversität>

repertoire: |
  <repertoire>
  Das eigentliche Ziel ist NICHT eine feste Bauform, sondern eine SPANNENDE METAPHER / ein produktiver WIDERSPRUCH / eine witzige KOHÄRENZ / ein goldener Schnitt über Metaphern hinweg. Strukturen und Beispiele in diesem Prompt sind WERKZEUG, KEIN Käfig — denke ohne Scheuklappen.
  Dein Material ist ALLES: Domänen, Phänomene, Materialien, Systeme, Wesen, Epochen — UND das gesamte etablierte Design-/Kunst-/Illustrations-/Zeichentechnik-Vokabular (Stile, Bewegungen, Medien, Druck-/Mal-/Zeichen-/Render-Techniken, Künstler-Handschriften). Nutze es als FRISCHE, SPEZIFISCHE Zutat einer Kollision — niemals als faule generische Einzelstil-Antwort.
  </repertoire>

register: |
  <render_register>
  Variiere nicht nur die DOMÄNE, sondern das RENDER-/MATERIAL-REGISTER: das Material-, Oberflächen-, Licht- und Gewichts-Gefühl, das der Leitwert in einem Bildmodell auslöst (z. B. Metall/Industrie · organisch/weich · digital/leuchtend · Papier/Archiv · Stein/Keramik · Textil/Faser · Glas/Flüssig · roh/elementar). Die N Ergebnisse müssen VERSCHIEDENE Register treffen — KEINE zwei im selben Material-/Render-Register, auch wenn ihre Domänen verschieden sind (zwei ferne Welten, die beide als «verwittertes Vintage-Messing-Papier» rendern, sind ein Register-Klon).
  </render_register>

compass: |
  <design_kompass>
  Spüre die DESIGN-DOMÄNE des Briefings (z. B. Fintech, Luxus, KI, Developer, Health, SaaS, Editorial, Architektur, Food, Fashion, Automotive, Legal …) und ihr gestalterisches Schwerefeld — das Register, in dem die Domäne natürlich lebt (Palette · Typo · Layout/Motion).
  Diese Domäne wirkt MAGNETISCH und LEICHT: ein sanfter Sog, der deine KONKRETEN Design-Parameter in die Resonanz der Domäne zieht. KEINE Schablone zum Abschreiben (kein harter Ref), KEIN Klischee, das gebrochen werden muss — nur eine Orientierung, damit das Ergebnis im richtigen Feld landet.
  Die ÜBERRASCHUNG kommt aus der fernen Kollision (dem Leitwert), NICHT aus der Domäne. Der Kompass macht die Übersetzung nur DESIGN-ANWENDBAR und domänen-stimmig — er ersetzt nie die kreative Idee und glättet sie nie zur Branchen-Norm.
  Übersetze die Kollision so in konkrete, domänen-magnetisierte Parameter: eine TYPO-RICHTUNG (Schrift-Charakter + ein konkreter Vorschlag) und LAYOUT & MOTION (Raster-/Kompositions-Idee + EIN Bewegungsprinzip) — je eine knappe Zeile, passend zu DIESEM Briefing. Lass die Palette ebenfalls leicht in die Domäne ziehen.
  Bei blank slate oder unklarer Domäne: wähle die naheliegendste, ziehe nur ganz leicht.
  </design_kompass>

extract: |
  <design_extraktion>
  Steht die Idee/Kollision, dann BEWEGE DICH DURCH DIE WELT DEINES ERGEBNISSES und nimm heraus, was man dort konkret SIEHT und ANFASSEN kann — bewusst, nicht beiläufig.
  Sammle das STÄRKSTE, ERGEBNIS-EIGENE: was dort herumliegt und typisch ist, Dinge zum Anfassen, Materialien und Oberflächen, charakteristische Formen, treffende Metaphern — auch Fiktives/Eigenes, das es nur in dieser Welt gibt.
  Ordne es über die Schichten (je das Stärkste, nicht alle erzwingen): MATERIAL/Oberfläche · FORM/Silhouette · LAYOUT/Anordnung · FARBE/Licht · BEWEGUNG.
  Jedes Element konkret, spezifisch, ownable — nichts Beliebiges/Erwartbares (Selbsttest: zögen 5 andere Tools dasselbe → raus). Leite daraus eine konkrete Palette, Typo-Richtung und Layout/Bewegung ab, die zu DIESEM Ergebnis passen.
  Ändere NICHT die Idee/den Leitwert — das ist die Übersetzung des Ergebnisses in Design, keine neue Idee.
  </design_extraktion>

render_probe: |
  <render_probe>
  Selbst-Render-Probe je Leitwert: stell dir vor, NUR der Leitwert (ohne Szene/Begründung) geht an ein Bildmodell. Entsteht eine VIVIDE, SPEZIFISCHE Welt — oder etwas Generisches/Vages? Wenn vage: schärfe ihn mit einem KONKRETEREN Welt-/Material-Begriff, bis er von selbst eine spezifische Designwelt zieht. Schärfe NUR die vagen — bereits konkrete Leitwerte NICHT überschärfen/verflachen. Er bleibt ein 2–4-teiliges Konkret-Kompositum, NIE eine Szene oder Anweisung.
  </render_probe>
