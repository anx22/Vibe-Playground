# Shared rule blocks — injected into the engine setups by `rules: [...]` (see scripts/build-setup.ts).
# THIS is the one place to tune the cross-cutting word-rules. Edit, then `npm run setup`.

leitwert: |
  <leitwert_format>
  Der Leitwert ist die EINE committete Design-RICHTUNG des Clusters — sein Anker und Titel. Er ist die KURATORISCHE VERDICHTUNG aller Funde auf GENAU EINE Richtung: du darfst entscheiden, gewichten, weglassen — es muss NICHT die ganze Welt hineinpassen. Leite ihn aus dem DOMINANTEN Charakter-Fund ab, damit Leitwert und Funde am selben Strang ziehen.
  FORM: ein verdichteter, FORM-TRAGENDER Titel (Kompositum oder kurze Nominalphrase). MINDESTENS ein Teil muss sichtbare GESTALT/Materialität tragen (Material, Oberfläche, Objekt, charakteristische Form), sodass er sofort KOPFKINO auslöst. Rein abstrakte System-Komposita ohne anfassbaren Anker sind ein „Substantiv-Schlachtfeld".
  EDITORIAL-FREIHEIT: du DARFST in echte Design-Sprache übersetzen — inklusive FINISH und ANWENDUNG (z. B. «Holographic Letterpress Cards», «Astro-Letterpress-Archive», «Tidenhub-Terminal»). DE oder EN — was die Richtung am besten benennt; je nachdem, WAS gefunden wurde und WAS am besten trägt.
  GUT: «Brennofen-Glasur» · «Holographic Letterpress Cards» · «Selvedge-Webkante» · «Tidenhub-Terminal» · «Astro-Letterpress-Archive».
  VERBOTEN: ganze Sätze; Verb-/Imperativ-Phrasen («… sichtbar machen»); «X ist Y»/«X trägt Y»; abstrakte Aphorismen; Wert-/Tugend-/Gefühlswörter als Leitwert («Stille», «Mut», «Würde», «Vertrauen», «Risiko», «Messung ist Mut»); rein abstrakte System-Komposita ohne anfassbaren Anker («Fehlerkorrektur-Signalfeld», bloße «-Schnittstelle»/«-Index»/«-Frequenz»).
  Der Leitwert benennt eine WELT/Richtung zum Sehen UND Anfassen, keine Botschaft.
  </leitwert_format>

diversity: |
  <diversität>
  Gilt NUR für FERNE Ergebnisse (register "fern"). NAHE bleiben bewusst in der Brief-Welt — dort NICHT zwanghaft fremde Domänen suchen.
  ZIELFÜHRUNG ZUERST: Distanz ist KEIN Selbstzweck. Eine ferne Welt darf NUR, wenn sie das ZIEL des Briefs (Premium-Gefühl + Funktion) BESSER oder FRISCHER liefert als eine nahe — sie muss ihre Distanz VERDIENEN. Frische, die den Brief nicht bedient, ist Weltflucht, kein Wert. Lieber eine etwas nähere Welt, die zielgenau trifft, als eine spektakulär ferne, die danebenliegt.
  Beispiele zeigen NUR Form/Methode, NIE Inhalt — übernimm keine ihrer Welten/Domänen/Wörter.
  MEIDE deine Gewohnheits-Spender (durch Übergebrauch selbst Klischee): Tiefsee/Hydrothermalquellen, Vulkanologie/Geologie, Buchbinderei/Bleisatz, Uhrmacherei, Kartografie, Damaststahl, Nō-Theater, Quipu, Leuchtturm, Imkerei, Alchemie, Fermentation. Nutze sie nur bei wirklich einzigartigem, zielführendem Reim.
  Variiere Wortform UND Objekt: keine zwei Leitwerte im Batch mit DERSELBEN Endung; die übernutzten -Protokoll/-Membran/-Logbuch/-Almanach/-Raster/-Kodex meiden. Das verdichtende Objekt kann ALLES sein (Werkzeug, Maschine, Speise, Instrument, Fahrzeug, Software, Körper, Gebäude) — nicht immer Buch/Archiv.
  </diversität>

repertoire: |
  <repertoire>
  Das eigentliche Ziel ist, GENAU DIESEN Brief mit einer frischen Welt treffsicher zu BEDIENEN — die spannende Metapher / der produktive Widerspruch / die witzige Kohärenz sind WERKZEUG dafür, nicht der Zweck. Cleverness, die den Brief nicht bedient, ist wertlos. Strukturen/Beispiele sind Werkzeug, kein Käfig.
  Dein Material ist ALLES (Domänen, Phänomene, Materialien, Systeme, Epochen, Handwerke, Orte, Rituale) — aber als FRISCHE, ZIELFÜHRENDE Zutat, nie als faule generische ODER bloß spektakuläre Antwort. (Du beschreibst WELTEN und MATERIAL, kein fertiges Design — kein Stil-/Layout-/Typo-Vokabular.)
  </repertoire>

register: |
  <material_register>
  Variiere nicht nur die DOMÄNE, sondern das MATERIAL-REGISTER: das Material-, Oberflächen- und Gewichts-Gefühl, das der Cluster auslöst (z. B. Metall/Industrie · organisch/weich · Papier/Archiv · Stein/Keramik · Textil/Faser · Glas/flüssig · roh/elementar). Die N Ergebnisse müssen VERSCHIEDENE Material-Register treffen — KEINE zwei im selben Register, auch wenn ihre Domänen verschieden sind (zwei ferne Welten, die beide nur als «verwittertes Vintage-Messing-Papier» fühlbar sind, sind ein Register-Klon).
  </material_register>

compass: |
  <welt_kompass>
  Spüre die DOMÄNE des Briefings (z. B. Fintech, Luxus, KI, Hochzeit, Developer, Health, Editorial, Food, Fashion, Architektur, Legal …) und ihr Schwerefeld — die Welt, in der die Domäne natürlich lebt.
  Für NAHE/Premium-Ergebnisse ist genau diese Domäne der Brunnen: hol das SCHÖNSTE, Best-in-Class aus ihrer EIGENEN Welt (Material, Handwerk, Atmosphäre) — etablierte schöne Konventionen sind ausdrücklich erlaubt, solange hochwertig und nicht plump.
  Für FERNE Ergebnisse ist die Bindung ein STARKER Magnet, kein loser Tilt. SPÜRE zuerst den KERN des Briefs: ist er selbst Handwerk/Material (z. B. Luxus-Uhren), trägt schon der strukturelle Reim. Ist der Kern ein GEFÜHL (ruhig-warm, verspielt) oder eine FUNKTION (Speed, Vertrauen, Präzision), muss die ferne Welt ZUERST genau dieses Gefühl UND diese Funktion teilen — nicht bloß eine sichtbare Struktur (Schichtung, Dichte). Die ÜBERRASCHUNG kommt dann allein aus der fernen DOMÄNE, die dasselbe Gefühl/dieselbe Funktion trägt — der Affekt bleibt gebunden, nur die Domäne ist fern. Praxis-Warnung (aus echten Fehlläufen): für „ruhig/warm" eine ferne WARME Welt (Wachsatelier, nachglühender Brennofen), NIE eine kalte/klinische (Eisbohrkern, Schlaflabor); für „Speed/Geld" eine Welt, die wirklich schnell/dicht-pulsierend IST, nicht bloß „präzise nebenan" (Forensik, Quanten); für „modern/Vertrauen" eine Welt, die Verlässlichkeit ausstrahlt, nicht historisches Handwerk schlechthin. Formel: Reim = Gefühl + Funktion (treffsicher) · Distanz = ferne Domäne (überraschend). Kompass, KEIN harter Filter — der Judge fängt den Rest; aber zieh bewusst STARK.
  KEINE Übersetzung in Design-Parameter (kein Layout, keine Typo, keine Farbwerte, keine Komposition, keine Motion) — der Kompass tilt nur die WELT-/Material-/Metaphern-Wahl, nicht die Gestaltung.
  Bei blank slate oder unklarer Domäne: wähle die naheliegendste, ziehe nur ganz leicht.
  </welt_kompass>

mix: |
  <register_mix>
  Liefere pro Runde BEIDE Register GEMISCHT — KEINE Engine ist nur „wild", keine nur „brav". Spreize bewusst über zwei Pole, ohne sie nach außen zu labeln (der Nutzer spürt den Unterschied selbst):
  - NAH/PREMIUM: ein Teil der Ergebnisse bleibt in der EIGENEN Welt des Briefings und holt dort das SCHÖNSTE, Best-in-Class heraus (Hochzeit → Leinen, gepresste Blumen, Letterpress, Seidenband; SaaS → klares Glas, präziser Stahl). Etablierte schöne KONVENTIONEN sind hier ausdrücklich ERLAUBT — auch nah am Genre, solange hochwertig und nicht plump-abgedroschen.
  - FERN/ÜBERRASCHEND: ein anderer Teil kommt aus einer fernen, frischen Welt/Kollision — überraschend, anti-Klischee (siehe <diversität>).
  Markiere jedes Ergebnis intern mit register: "nah" oder "fern". Das Verhältnis ist ADAPTIV, nicht fix: SPÜRE am Briefing, wohin es kippt — eine kompromisslose Heritage-/Luxus-/Vertrauens-Welt verträgt SCHWERPUNKT nah; ein verspieltes, experimentelles, fantasievolles Briefing verträgt SCHWERPUNKT fern. ABER halte einen BODEN: mindestens EIN Ergebnis je Pol bleibt IMMER (nie alles in einen Pol), damit weder Premium noch Überraschung je ganz wegfällt. Premium heißt nicht generisch, sondern: das BESTE seiner Klasse für GENAU dieses Briefing.
  </register_mix>

cluster: |
  <denkanstoss_cluster>
  Steht die Welt, dann ERNTE sie: hol konkrete, sichtbare GESTALT heraus, aus der eine nachgelagerte Bild-/Design-KI direkt etwas bauen kann. KEIN fertiges Design (kein Layout, keine Typo, keine UI-Komposition, keine verordnete Marken-Palette, keine benannten Stile/Künstler, keine Animation) — aber auch KEINE leere Atmosphäre. Der Cluster besteht aus:
  - weltSatz: 1–2 Sätze Kopfkino — die HEADLINE und SEELE des Clusters (das Erste, was Mensch UND Bild-KI lesen). Er trägt die STIMMUNG und die WELT-GANZHEIT: Atmosphäre, das Licht- und Material-Gefühl des Ortes, wie sich die ganze Welt anfühlt — das, was KEIN einzelner Fund tragen kann. Sinnlich und konkret in einer sichtbaren Welt verortet, aber er ZÄHLT NICHT die einzelnen Formen auf (das ist Aufgabe der funde) und ist KEINE Design-Anweisung.
  - funde: so viele reine VISUELLE FUNDE wie WIRKLICH STARK sind — KEIN Auffüllen auf eine Zahl (lieber 4 zwingende als 7 mit Füllern), HÖCHSTENS 7, mindestens ~4. Als DICHTE, KNAPPE Bild-Wendungen (Stichwort-/Phrasen-Länge, ~3–8 Wörter) — KEINE ganzen Sätze, KEINE erklärenden Nebensätze („…, die sich … zieht"), keine Narration. Benenne den FUND + seine prägnante visuelle Eigenschaft, fertig. Jeder ist ein konkretes, ZEICHENBARES Detail (Form · Struktur · Kante · Oberfläche · Licht), spezifisch für GENAU diese Welt und von sich aus move-reich; den gestalterischen Move formulierst du NICHT aus. Ernte gespreizt über das ganze Design-Universum, mit EINEM dominanten Charakter-Fund:
      · Form & Geometrie (Silhouette, Bogen, Spirale, Wabe, Negativraum)
      · Struktur & Fügung (Raster, Schichtung, Naht, Knoten, Dichte, Proportion)
      · Linie & Kante (haarfein↔massiv, graviert/gestisch, Rand, Beschnitt)
      · Oberfläche & Material (Textur, Finish, Patina, Verwitterung)
      · Licht & Optik (gerichteter Glanz, Brechung, Transluzenz, Glint)
      · Farbe & Ton — NUR als beobachtete Eigenfarbe der Welt (Oxid-Grün, Ofen-Anthrazit), NIE als verordnete Palette
      · Rhythmus, Proportion, Kontrast (Takt, matt↔glänzend, schwer↔haarfein, dicht↔leer)
      · Eingefrorene Dynamik & Motiv (erstarrte Geste/Fluss in der Form, wiederholbares Zeichen — statisch, keine Animation)
    Latte je Fund: (1) spezifisch für DIESE Welt — kein Stock-Bild; (2) zeichenbar/sichtbar; (3) inhärent generativ.
    KNAPP (gut): „lichtbrechendes CNC-Mikrorillen-Raster" · „haarfeines Krakelee-Netz über matter Glasur" · „Anlauffarben-Band Strohgelb→Blau→Grau" · „auskristallisierte Salzfacetten, gerichteter Glint" · „konzentrische Zwiebelschicht im Querschnitt". ZU LANG (schlecht): „die feine Längsnaht der Gussform auf der Kerzenoberfläche — eine zarte erhabene Linie, fast weggerieben".
    HART VERBOTEN als Fund: Zustände/Gefühle („Stille", „Wärme die nirgendwo entweicht", „Schweigen"); Abwesenheit/Nichts („Horizont ohne Kante", „Oberfläche die nichts festhält"); Konzept-Wortspiele/Brief-Mappings („Fehlstelle als Feature", „Schnitt als Commit", „kennt seine eigene Version"). Das ist Luft, kein Fund.
  - materialien: 4–6 ECHTE Materialien/Oberflächen (Leinen, gebürstetes Messing, Riffelglas, Büttenpapier). NUR Stoffe — keine Konstruktionen, Bauteile oder Apparate („Doppelboden", „Ventil", „Gehäuse" sind KEINE Materialien).
  - bildReferenzen: 2–3 REALE, BENENNBARE Bild-Anker — existierende Objekte/Szenen/Artefakte, die man suchen oder aufs Moodboard legen könnte (z. B. „die Innenseite einer Fresnel-Leuchtturmlinse", „ein aufgefächertes Nishijin-Seidenmusterbuch"). KEINE poetischen „wie …"-Vergleiche, KEINE benannten Stile/Künstler, kein erfundenes Bild.
  FORM-AUSBEUTE-GATE: Bevor du eine Welt nimmst, prüfe — gibt sie genug konkrete, zeichenbare GESTALT her? Eine Welt, die nur Stimmung, Konzept oder Leere liefert (so schön sie klingt), ist ein FAIL — verwirf sie und nimm eine, die formreich ist.
  </denkanstoss_cluster>

render_probe: |
  <render_probe>
  Selbst-Probe je Leitwert: stell dir vor, NUR der Leitwert (ohne weltSatz/Begründung) geht an ein Bildmodell. Entsteht eine VIVIDE, SPEZIFISCHE Welt — oder etwas Generisches/Vages? Wenn vage: schärfe ihn mit einem KONKRETEREN Welt-/Material-Begriff, bis er von selbst eine spezifische Welt zieht. Schärfe NUR die vagen — bereits konkrete Leitwerte NICHT überschärfen/verflachen. Er bleibt ein 2–4-teiliges Konkret-Kompositum, NIE eine Szene oder Anweisung.
  </render_probe>
