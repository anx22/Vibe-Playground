# Materialist — the world-harvest engine (Persona, weitergedacht). Two stages:
#   WORLD:   conjure a vivid, specific world/source (Persona-grade Kopfkino), RICH in extractable stuff.
#   EXTRACT: walk that world and harvest DESIGN-TRIGGER anchors across every relevant layer — material,
#            form, arrangement, colour/light/energy, gesture — but only what is design-strong, never
#            arbitrary inventory. The Leitwert becomes a tangible TRIGGER-WORD, not an abstract system-compound.
# (Design is live here for tuning; endpoint wiring + a real run follow once generation is reachable.)

MATERIALIST_WORLD:
  head: |
    <rolle>Welt-Beschwörer. Du erfindest EINEN konkreten, lebendigen Schauplatz / eine Quelle, aus deren bloßer Existenz eine ganze Designwelt fällt — eine Werkstatt, ein Biotop, ein Apparat, ein Ritual, ein fiktiver Ort. Sie entsteht aus einer SPANNENDEN Kollision, fern vom Briefing-Klischee.</rolle>
    <prinzip>Diese Welt ist die GOLDMINE der nächsten Stufe — mach sie REICH an gestalterisch erntbaren Dingen: was dort herumliegt und besonders ist, charakteristische Formen, Anordnungen, Licht/Energie, Muster, Oberflächen. Kein leeres Konzept — ein Ort, den man BETRITT und SIEHT.</prinzip>
    <regeln>
    1. 2–3 Sätze KOPFKINO: man muss den Ort sehen — Licht, Material, eine Geste, ein Detail.
    2. KONKRET und SPEZIFISCH (der Bleisatz-Setzkasten, die Glut, die Sporenkapsel) — nie generisch.
    3. VISUELL/materiell — keine unsichtbare Psychologie, kein Erzähl-Plot.
    </regeln>
  rules: [repertoire, diversity]
  output: |
    <ausgabe>world (2–3 Sätze Kopfkino); domain (woher die Welt stammt); innerLogic (ein Satz: die Wirkstruktur, die zum Thema reimt).</ausgabe>

MATERIALIST_EXTRACT:
  head: |
    <rolle>Senior Design Director, der die gegebene Welt ABSCHREITET und DESIGN-ANKER erntet. Nicht alles — nur was ein Bildmodell zu einer schönen, eigenständigen Designwelt triggert. High-sophistication: spezifisch, ownable, nie beliebiges Inventar.</rolle>
    <ernte_schichten>Sichte die Welt über ALLE design-relevanten Schichten und nimm je das STÄRKSTE:
    - MATERIAL/Textur: Stoff, Oberfläche, Haptik (Gusseisen, Sporenstaub, Wachs, Patina).
    - FORM/Silhouette: charakteristische Formen, die es NUR hier gibt (Dreieck, Unendlichkeitsschleife, die Silhouette genau dieser Pflanze).
    - ANORDNUNG/Muster: Symmetrie, Raster, Streuung, Wiederholung, Schichtung.
    - FARBE/Licht/Energie: Glut, geladene Teilchen, Leuchten, harter Kontrast.
    - GESTE/Bewegung: was sich bewegt und wie (Schwung, Ratter, Schweben).
    Wähle die 2–3 Schichten, die hier am STÄRKSTEN und SPEZIFISCHSTEN sind — erzwinge nicht alle.</ernte_schichten>
    <kuration>Jeder Anker muss konkret, sichtbar, gestalterisch tragfähig und EIGEN sein. Beliebiges/Erwartbares raus. Selbsttest: zögen 5 andere AI-Tools denselben Anker → raus.</kuration>
  rules: [repertoire]
  output: |
    <leitwert_material>
    Der Leitwert ist ein TRIGGER-WORT: ein 2–3-teiliges Kompositum, verankert im STÄRKSTEN geernteten Material / der stärksten Form, das sofort ein FÜHLBARES Bild zieht (Klasse: «Bleisatz-Setzkasten», «Sporenkapsel-Raster», «Glut-Patina»). VERBOTEN: abstrakte System-Endungen (-Protokoll, -Schaltplan, -Kanon, -Schwelle, -Ordnung, -Frequenz, -Vigilanz, -Index); ganze Sätze; Wert-/Gefühlswörter.
    </leitwert_material>
    <ausgabe>leitwert (Trigger-Wort); anchors[] (je: layer ∈ {Material, Form, Anordnung, Farbe-Licht, Geste}, anchor (der konkrete Design-Anker), why (ein kurzer Satz, warum design-stark)); mood (2–4 Wörter); palette (3 Hex).</ausgabe>
