# Engine E — Latent-Agent. Two stages: DIVERGE (propose a wide far field) → embeddings measure
# distance → COMPOSE (resonate + name the survivors).
LATENT_DIVERGE:
  head: |
    <rolle>DIVERGER der Latent-Agent-Engine.</rolle>
    <aufgabe>
    1. ESSENZ (Wirkstruktur) destillieren — abstrakt, ohne Oberflächen-/Domänenwörter, ein Satz.
    2. Die 3–5 naheliegenden Design-Klischees verbrennen.
    3. Ein WEITES Feld von 12–16 Spender-Welten vorschlagen, maximal FERN vom Thema, aus ALLEN Epochen (historisch, gegenwärtig, futuristisch, digital, spekulativ — NICHT nur historisch) und ALLEN Kulturen (auch nicht-westlich, vernakulär), quer durch ALLE Wissensgebiete. KEINE topischen Nachbarn, keine faule Einzelstil-Antwort. Bewusst über sehr verschiedene Domänen streuen.
    </aufgabe>
    <hinweis>Die Distanz misst danach ein Embedding-Index — liefere echte Streuung, nicht Varianten.</hinweis>
  rules: [repertoire, diversity]
  output: |
    <ausgabe>essence; forbidden[]; donors[] mit world + gist (ein Satz innere Logik).</ausgabe>

LATENT_COMPOSE:
  head: |
    <rolle>RESONATOR + KOMPONIST + NAMER der Latent-Agent-Engine.</rolle>
    <input>Eine ESSENZ, eine Verbotsliste und eine bereits als FERN gemessene Auswahl von Spender-Welten.</input>
    <vorgehen>
    1. Nur Welten behalten, deren innere Logik mit der Essenz strukturell REIMT (bloß-ferne ohne Reim raus).
    2. Affordanz-Test: jede genutzte Welt muss ≥5 konkrete gestalterische Affordanzen hergeben.
    3. Brücken aus je 2 Welten komponieren, die BEIDE mit DERSELBEN Essenz reimen (Reibung erhalten, nicht mitteln). Die Brücken müssen verschiedene Verhaltens-Zellen abdecken (Domänen-Familie / Ära / Stimmung) — Vielfalt ist Pflicht, keine Near-Duplicates.
    </vorgehen>
    <harte_ablehnungen>Klischee aus der Verbotsliste; wörtliche Abbildung des Themas; eine creativeDerivation, die wie Szene oder Anweisung klingt.</harte_ablehnungen>
  rules: [leitwert, repertoire, diversity, register, render_probe]
  output: |
    <ausgabe>bridges[] mit worlds{name, role, rhyme}, objectMetaphor, creativeDerivation (1–2 Sätze, WARUM der Reim hält), mood, palette (3 Hex), domainDistance, affordances (≥5).</ausgabe>
